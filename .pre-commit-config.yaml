repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.13
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        pass_filenames: false
        args: [src]

  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: venv/bin/python -m pytest
        language: system
        pass_filenames: false
        types_or: [python]
