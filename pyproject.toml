[tool.ruff]
# Под какую версию Python проверять синтаксис и правила
target-version = "py314"
# Максимальная длина строки
line-length = 88

[tool.ruff.lint]
# Какие группы правил включены:
# E - pycodestyle errors, W - pycodestyle warnings, F - pyflakes,
# I - сортировка импортов (isort), B - bugbear (вероятные баги),
# UP - pyupgrade (модернизация синтаксиса), SIM - simplify
select = ["E", "W", "F", "I", "B", "UP", "SIM"]
ignore = ["B008"]  # FastAPI: Depends() в дефолтах — идиоматично

[tool.ruff.format]
# Использовать двойные кавычки
quote-style = "double"
# Использовать пробелы вместо табов
indent-style = "space"
# Оставлять "магические" висячие запятые для удобного переноса строк
skip-magic-trailing-comma = false
# Автоматически выбрать стиль перевода строк под среду/файл
line-ending = "auto"

[tool.mypy]
# Какие каталоги проверять по умолчанию
files = ["src"]
# Импорты идут как `from src.xxx`, поэтому корень пакетов — backend/, не src/
explicit_package_bases = true
namespace_packages = true
# Под какую версию Python проверять типы
python_version = "3.14"
# Проверять даже тела функций без полной типизации
check_untyped_defs = true
# Показывать коды ошибок рядом с сообщениями
show_error_codes = true
# Предупреждать о лишних type: ignore
warn_unused_ignores = true
# Не падать на внешних библиотеках без type stubs
ignore_missing_imports = true
